[package]
name = "why-linux"
version = "0.1.3"
edition = "2024"
description = "Explain why things exist on a Linux system"
license = "MIT"
repository = "https://github.com/aethctl/why"
readme = "README.md"
keywords = ["linux", "diagnostics", "systemd", "nix", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "why"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
owo-colors = "4.2"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
